stages:
  - image
  - lint
  - validate
  - release

variables:
  DOCKER_IMAGE_PATH: registry.heptapod.net:443/fluiddyn/install-locked-env/ci/default

image: $DOCKER_IMAGE_PATH:stable

before_script:
  - echo appuser | sudo -S chown -R appuser .hg


# Build an image for the above tasks; this should be a scheduled job, as
# it is quite unnecessary to run on every invocation.
image:build:
  stage: image
  tags:
    - container-registry-push
  needs: []
  # comment these rules for MR modifying the Docker file
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_BUILD_IMAGES == "1"
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  before_script:
    - ""
  script:
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "username": "$CI_REGISTRY_USER",
            "password": "$CI_REGISTRY_PASSWORD"
          }
        }
      }
      EOF
    - >
      /kaniko/executor --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/docker/Dockerfile
      --single-snapshot
      --cleanup
      --destination $DOCKER_IMAGE_PATH:stable


lint-with-ruff:
  stage: lint
  needs:
    - job: "image:build"
      optional: true
  script:
    - pdm sync -G dev
    - pdm run ruff format --check

.test:
  stage: validate
  needs:
    - job: "lint-with-ruff"
  needs: []
  script:
    - pdm use $PYTHON_VERSION
    - pdm sync -G test
    - pdm run pytest test -v

test-py3.11:
  extends: .test
  variables:
    PYTHON_VERSION: 3.11

test-py3.12:
  extends: .test
  variables:
    PYTHON_VERSION: 3.12

test-py3.13:
  extends: .test
  variables:
    PYTHON_VERSION: 3.13

test-py3.14:
  extends: .test
  variables:
    PYTHON_VERSION: 3.14


build:
  stage: validate
  needs:
    - job: "image:build"
      optional: true
  needs: []
  script:
    - pdm build -v
    - ls dist/install_locked_env*
  artifacts:
    when: always
    paths:
      - pdm.lock
      - dist
    expire_in: 24 hrs

# manually set PDM_PUBLISH_PASSWORD in web interface to your pypi API token
release:package:
  stage: release
  needs: [ "build" ]
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      when: never
    - if: '$CI_COMMIT_TAG'
      when: on_success
  variables:
    PDM_PUBLISH_USERNAME: __token__
  script:
    - ls dist/install_locked_env*
    - pdm publish --no-build
